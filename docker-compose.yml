# Only Postgres runs in docker. The backend, frontend, ttyd, tmux and claude all
# run on the host because they need direct access to host tmux/claude/acli/gh.
services:
  postgres:
    image: postgres:16-alpine
    container_name: conductor-postgres
    # auto-recover after a crash or Docker/OrbStack restart, so the board doesn't go
    # empty on the next reboot (a bare `docker start` was needed otherwise).
    restart: unless-stopped
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    ports:
      - "5433:5432"
    volumes:
      - conductor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  conductor_pgdata:
