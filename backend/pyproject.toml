[project]
name = "conductor"
version = "0.1.0"
description = "Personal Kanban cockpit over Jira + GitHub + Slack"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "webauthn>=2.4",
    "google-auth>=2.35",
    "requests>=2.32",
    "alembic>=1.18.5",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conductor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
